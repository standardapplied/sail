name: Test evidence
description: >
  Leaves what a test job's maven run proved where it can be read without the log: the totals and
  every failed test in the job summary, and, unless the job passed, the surefire and failsafe
  reports as an artifact. Run it last, with `if: always()`, after a maven step that teed its
  output to $RUNNER_TEMP/maven.log.

inputs:
  job-status:
    description: The calling job's status, `job.status`. A composite action cannot read it itself.
    required: true

runs:
  using: composite
  steps:
    # The classes that finished are counted because a maven killed at the job limit prints no
    # totals.
    - name: Summarize the maven log
      shell: bash
      run: |
        log="$RUNNER_TEMP/maven.log"
        {
          echo "### Tests of $GITHUB_JOB"
          if [ -f "$log" ]; then
            echo "Test classes finished: $(grep -c 'Tests run: .* -- in ' "$log" || true)"
            echo '```'
            grep -E -- '--- (surefire|failsafe):[^ ]+:(test|integration-test) |Tests run: [0-9]+, Failures: [0-9]+, Errors: [0-9]+, Skipped: [0-9]+$|<<< (FAILURE|ERROR)!' "$log" || true
            echo '```'
          else
            echo "Maven never ran: the job stopped before its test step."
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload the surefire and failsafe reports
      if: inputs.job-status != 'success'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ github.job }}-test-reports
        if-no-files-found: ignore
        path: |
          **/target/surefire-reports
          **/target/failsafe-reports
