name: Native binaries
description: >
  Builds the native image under test and smoke-tests it: the input of every test that runs a fleet
  of this build.

outputs:
  candidate:
    description: The native binary built from this commit.
    value: ${{ github.workspace }}/sail-infra/target/sail

runs:
  using: composite
  steps:
    - name: Build native image
      shell: bash
      run: mvn -B package -Pnative -DskipTests

    - name: Smoke test
      shell: bash
      run: |
        ./sail-infra/target/sail -V
        ./sail-infra/target/sail _pty-selftest
