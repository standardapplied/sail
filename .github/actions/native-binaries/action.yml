name: Native binaries
description: >
  Fetches the released binary .github/released-tag pins and builds the native image under test,
  each smoke-tested: the two inputs of every test that upgrades a fleet's release to this build.
  The image is kept in the cache under everything it is built from (the main sources and
  resources, the poms, this action, the optimization level and the GraalVM build), so a commit
  that changes none of them, one that changes only tests or CI, takes the image built from the
  same inputs instead of building it again.

inputs:
  optimization:
    description: The native-image optimization level; CI tests a quick `-Ob` build, a release ships `-O2`.
    required: false
    default: '-O2'

outputs:
  candidate:
    description: The native binary built from this commit.
    value: ${{ github.workspace }}/sail-infra/target/sail
  released:
    description: The pinned release's Linux binary, checked against its published checksum.
    value: ${{ runner.temp }}/released/sail-linux-amd64

runs:
  using: composite
  steps:
    # The pin is read before anything is built, so a tag with no release fails in seconds.
    - name: Download the pinned released binary
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        pin=.github/released-tag
        tag="$(tr -d '[:space:]' < "$pin")"
        if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error file=$pin::$pin holds '$tag', not a release tag. Set it to one line such as v0.46.4."
          exit 1
        fi
        mkdir -p "$RUNNER_TEMP/released"
        if ! gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/released" \
          --pattern sail-linux-amd64 --pattern sail-linux-amd64.sha256; then
          echo "::error file=$pin::$pin names $tag, which $GITHUB_REPOSITORY has not released with a sail-linux-amd64 binary and checksum. Set it to a published release."
          exit 1
        fi
        cd "$RUNNER_TEMP/released"
        echo "$(cat sail-linux-amd64.sha256)  sail-linux-amd64" | sha256sum -c -
        chmod +x sail-linux-amd64
        ./sail-linux-amd64 -V

    - name: Name the GraalVM build
      id: graalvm
      shell: bash
      run: echo "build=$(java -version 2>&1 | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

    - name: Restore the image built from the same inputs
      id: image
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: sail-infra/target/sail
        key: native-image-${{ runner.os }}-${{ runner.arch }}${{ inputs.optimization }}-${{ steps.graalvm.outputs.build }}-${{ hashFiles('**/pom.xml', 'sail-*/src/main/**', '.github/actions/native-binaries/action.yml') }}

    - name: Build native image
      if: steps.image.outputs.cache-hit != 'true'
      shell: bash
      run: mvn -B package -Pnative -DskipTests -Djacoco.skip=true -Dspotless.check.skip=true -Dsail.native.optimization=${{ inputs.optimization }}

    - name: Smoke test
      shell: bash
      run: |
        ./sail-infra/target/sail -V
        ./sail-infra/target/sail _pty-selftest

    - name: Keep the image for a commit built from the same inputs
      if: steps.image.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: sail-infra/target/sail
        key: ${{ steps.image.outputs.cache-primary-key }}
