name: Incus
description: >
  Installs and initializes incus on the runner, gives its containers outbound internet, fetches
  the base image and holds the incus suites' prepared image, every lane's from one recipe
  (ci/images prepared-image). The runner's packages and the prepared image come from caches kept per
  week; on a miss this action fetches or bakes them, with bounded tries, before any test, and the
  cache keeps them when the job succeeds. No test reaches an external host for a package.

runs:
  using: composite
  steps:
    # Kept per week, so nothing cached is staler than a week; the runner's packages also per runner
    # image, whose preinstalled packages their files were resolved against.
    - name: Name this week and this runner image
      id: week
      shell: bash
      run: |
        echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
        echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

    # The Incus host init installs: Zabbly's stable repository, as on every box (HostPackages),
    # unpinned, so CI tests Zabbly's stable release of the week, not the release a box that
    # installed it earlier holds. Ubuntu 24.04's own incus 6.0.0, which a box keeps when it came
    # with it and which cannot make a mirrored ZFS pool, is covered only by the unit tests of
    # Sail's refusal of it (IncusStorageTest, HostProvisionerTest). Its files and the ZFS tools'
    # are fetched once a week per runner image (`ci/images runner-packages fetch`, from Ubuntu's own
    # sources and Zabbly's only, as the runner image's third-party sources fail on their own
    # schedule) and installed from those files with no network, the same way after a fetch as
    # after a restore.
    - name: Restore the runner's packages
      id: packages
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.temp }}/runner-packages
        key: incus-runner-packages-${{ steps.week.outputs.image }}-${{ hashFiles('ci/images') }}-${{ steps.week.outputs.week }}

    - name: Fetch the runner's packages
      if: steps.packages.outputs.cache-hit != 'true'
      shell: bash
      run: ci/images runner-packages fetch "$RUNNER_TEMP/runner-packages"

    # The runner's sudo keeps the runner's environment, HOME and XDG_CONFIG_HOME/XDG_CACHE_HOME
    # among it, and the incus client makes its config and cache directories there on its first
    # run (os.UserConfigDir, os.UserCacheDir): root's init is run as a box's sudo runs it, its own
    # home and no XDG directories, so no root-owned directory is left in the runner's home, and the
    # runner's first incus makes its own, which a later root incus finds and leaves as it is.
    - name: Install and initialize incus
      shell: bash
      run: |
        ci/images runner-packages install "$RUNNER_TEMP/runner-packages" incus
        sudo -H env -u XDG_CONFIG_HOME -u XDG_CACHE_HOME incus admin init --minimal
        sudo chmod o+rw /var/lib/incus/unix.socket
        if [ -e "$HOME/.config/incus" ] || [ -e "$HOME/.cache/incus" ]; then
          ls -la "$HOME/.config" "$HOME/.cache" >&2
          echo "a root incus left directories in the runner's home" >&2
          exit 1
        fi

    # The runner's Docker install sets the iptables FORWARD policy to DROP, which silently drops
    # the incus NAT bridge's egress, so containers can resolve DNS but cannot connect out (apt and
    # image pulls time out). Allow forwarding so provisioned containers reach the net.
    - name: Give launched containers outbound internet
      shell: bash
      run: |
        sudo sysctl -w net.ipv4.ip_forward=1
        sudo iptables -P FORWARD ACCEPT

    - name: Verify incus is reachable by the runner
      shell: bash
      run: |
        which incus
        incus version
        incus list

    # After incus has started, as on a box whose Incus came first: the ZFS suite proves Incus sees
    # the tools without a restart.
    - name: Install the ZFS tools
      shell: bash
      run: ci/images runner-packages install "$RUNNER_TEMP/runner-packages" zfsutils-linux

    # Every suite launches this image; fetched once here, its download is no test class's time.
    - name: Fetch the base image
      shell: bash
      run: |
        for attempt in 1 2 3; do
          incus image copy images:ubuntu/24.04 local: --quiet && exit 0
          echo "Fetching the base image failed (attempt $attempt of 3)."
          sleep 10
        done
        exit 1

    # The prepared image is the base plus every package the suites and a project's provisioning
    # install. It is kept per week and per source that defines it (the recipe in ci/images, the alias
    # in AbstractIncusIT, the baseline in ProjectProvisioner), so it is never staler than a week nor
    # older than its package list. On a miss it is baked here, before any test, and kept in the
    # cached path at once.
    - name: Restore the prepared image
      id: prepared
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.temp }}/prepared-image
        key: incus-prepared-${{ hashFiles('ci/images', 'sail-infra/src/test/java/ai/singlr/sail/engine/AbstractIncusIT.java', 'sail-infra/src/main/java/ai/singlr/sail/engine/ProjectProvisioner.java') }}-${{ steps.week.outputs.week }}

    - name: Import the prepared image
      if: steps.prepared.outputs.cache-hit == 'true'
      shell: bash
      run: ci/images prepared-image import "$RUNNER_TEMP/prepared-image"

    - name: Bake the prepared image
      if: steps.prepared.outputs.cache-hit != 'true'
      shell: bash
      run: |
        ci/images prepared-image bake
        ci/images prepared-image export "$RUNNER_TEMP/prepared-image"
