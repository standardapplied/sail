name: Clients

on:
  # A release calls this for its app alone (release.yml's app job): the app then bundles the
  # darwin sail the release built and signed in the same run, and no SailKit lane runs again.
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      record-goldens:
        description: Draw the golden frames afresh and upload them for review, comparing none
        type: boolean
        default: false

permissions:
  contents: read

# A release's call is its own group, by its run: a release started by hand on main shares main's
# ref, and must neither cancel main's Clients run nor be cancelled by it.
concurrency:
  group: clients-${{ inputs.release && format('release-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The darwin sail of this commit, built once per run as the release builds it, for the macOS
  # lanes' own local host: a client and the host it is tested against always speak one protocol.
  host:
    name: The darwin sail of this commit
    needs: changes
    if: needs.changes.outputs.clients == 'true' && !inputs.release
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: graalvm/setup-graalvm@bef4b0e916c7dd079bf60fb95d49139f67e32c5f # v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/maven-cache
        with:
          kind: native

      - name: Build native image
        run: mvn -B package -Pnative -DskipTests -Djacoco.skip=true -Dspotless.check.skip=true

      - name: Smoke test
        run: |
          selftest=$(./sail-infra/target/sail _pty-selftest)
          echo "$selftest"
          grep -qx 'local-selftest: ok' <<< "$selftest"
          ci/check min-macos ./sail-infra/target/sail

      - name: Leave the binary for the macOS lanes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sail-darwin-arm64
          path: sail-infra/target/sail
          retention-days: 3
          if-no-files-found: error

  # SailKit builds and tests on both platforms, as two jobs, so Linux never waits for the darwin
  # sail only macOS uses. Linux builds libghostty-vt from its release tarballs
  # (scripts/libghostty-vt, cached under the script, which holds every pin); macOS takes the pinned
  # xcframework through SwiftPM and runs the terminal tests against this machine's own host, the
  # darwin sail of this commit. Both run the suites as scripts/suites says.
  sailkit-linux:
    name: SailKit on Linux
    needs: changes
    if: needs.changes.outputs.clients == 'true' && !inputs.release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clients/SailKit
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Swift
        run: swift --version

      - name: Keep libghostty-vt built from its pins
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/sailkit/libghostty-vt
          key: libghostty-vt-install-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('clients/SailKit/scripts/libghostty-vt') }}

      - name: libghostty-vt
        run: |
          scripts/libghostty-vt "$HOME/.cache/sailkit/libghostty-vt" "$RUNNER_TEMP/libghostty-vt-downloads"
          echo "PKG_CONFIG_PATH=$HOME/.cache/sailkit/libghostty-vt/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Keep SwiftPM's downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('clients/SailKit/Package.swift') }}

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: scripts/suites rest "$RUNNER_TEMP/rest-events.jsonl"

      - name: Exhaustive and seeded suites
        run: scripts/suites exhaustive "$RUNNER_TEMP/exhaustive-suites.log"

  sailkit-macos:
    name: SailKit on macOS
    needs: [changes, host]
    if: needs.changes.outputs.clients == 'true' && !inputs.release
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clients/SailKit
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app

      - name: Swift
        run: swift --version

      - name: Keep SwiftPM's downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('clients/SailKit/Package.swift') }}

      - name: The darwin sail of this commit
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sail-darwin-arm64
          path: ${{ runner.temp }}/sail

      - name: For this machine's own host
        run: |
          chmod +x "$RUNNER_TEMP/sail/sail"
          echo "SAIL_BINARY=$RUNNER_TEMP/sail/sail" >> "$GITHUB_ENV"

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: scripts/suites rest "$RUNNER_TEMP/rest-events.jsonl"

      - name: Exhaustive and seeded suites
        run: scripts/suites exhaustive "$RUNNER_TEMP/exhaustive-suites.log"

      # The scenarios ran in the Test step; this measures, on the machine the renderer will run on,
      # the screen's own overhead (release, as the app ships) and the echo through this machine's
      # own host.
      - name: Overhead and echo latency on macOS
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          swift build -c release --product sail-term-probe
          "$(swift build -c release --show-bin-path)/sail-term-probe" --bench --report "$RUNNER_TEMP/reports/macos-bench.json"
          "$(swift build -c release --show-bin-path)/sail-term-probe" --local --host-binary "$SAIL_BINARY" --folder /tmp \
            --script Tests/Probe/measure.json --report "$RUNNER_TEMP/reports/macos-measure.json"

      - name: Leave the probe's reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sailkit-macos-probe-reports
          if-no-files-found: ignore
          path: ${{ runner.temp }}/reports

  # Whether this change can affect the client lanes, as ci/changes decides it for this workflow and
  # CI: clients/ (SailApp's one dependency is ../SailKit by path), this workflow, that script, and
  # what the darwin sail the macOS lanes test against and bundle is built from (the build files and
  # the Java modules' main sources). A job skipped by `if:` reports success, unlike a
  # workflow-level path filter, so a required check is not left waiting. An unknown base (a new
  # branch, a forced push), an empty change and a dispatch run the lanes.
  changes:
    name: What the change touches
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      clients: ${{ steps.diff.outputs.clients }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: ci/changes "$EVENT" "$BASE" >> "$GITHUB_OUTPUT"

  # The macOS app: the Metal device first; the renderer's goldens, the view's input tests and the
  # shell's; the app driven, with a software passkey, against this commit's darwin sail's own local host
  # and two control planes it starts on this runner, under a graphite system accent; then
  # the shipped bundle signed with Developer ID, its provisioning profile embedded and its
  # entitlements claimed, and notarized, when all seven signing secrets exist (ci/signing says so),
  # and otherwise an unsigned build, signed ad hoc with neither, and named unsigned. The drive build
  # has the shipped bundle id and is signed the same way; it is never uploaded as the app.
  app:
    name: SailApp on macOS
    needs: [changes, host]
    # In a release the host job does not run (the release built its darwin sail), so the app runs
    # on its own condition rather than on the host's success.
    if: ${{ !cancelled() && (inputs.release || (needs.changes.outputs.clients == 'true' && needs.host.result == 'success')) }}
    runs-on: macos-15
    timeout-minutes: 45
    # actions: read, to download the app's zip from the artifact service by its id.
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        working-directory: clients/SailApp
    env:
      SAIL_RECORD_GOLDENS: ${{ inputs.record-goldens && '1' || '0' }}
      # The app's zip, and so its artifact, is named for this attempt of the run: a run's artifacts
      # outlive their attempt, and download-artifact keeps one artifact per name, the one with the
      # highest id, which need not be the newest. A re-run attempt's zip named as the first's was
      # dropped from the list, and its download by its own id failed ("None of the provided
      # artifact IDs were found", Clients run 44300832101, attempt 3).
      SHIPPED: Sail-${{ github.sha }}${{ github.run_attempt != '1' && format('-attempt{0}', github.run_attempt) || '' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app

      - name: Signing on or off (all seven secrets, or none)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mode=$(ci/signing)
          echo "SIGNING=$mode" | tee -a "$GITHUB_ENV"

      - name: A Metal device
        run: |
          cat > "$RUNNER_TEMP/device.swift" <<'SWIFT'
          import Metal
          guard let device = MTLCreateSystemDefaultDevice() else {
              print("This runner has no Metal device. The app lane needs one: run it on GitHub's larger macOS runner (macos-15-xlarge).")
              exit(1)
          }
          print("Metal device: \(device.name)")
          SWIFT
          swift "$RUNNER_TEMP/device.swift"
          sw_vers -productVersion

      - name: Keep SwiftPM's downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-app-${{ runner.os }}-${{ hashFiles('clients/SailKit/Package.swift', 'clients/SailApp/Package.swift') }}

      - name: The darwin sail of this commit
        if: ${{ !inputs.release }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sail-darwin-arm64
          path: ${{ runner.temp }}/sail

      # A release's app bundles the darwin sail the release built and signed in this same run, the
      # one it publishes: one binary, built once, attested once. It is used only once its sha256 is
      # the one the release publishes and its signature is the release workflow's at this tag; the
      # step prints both sums and the binary's version, for whoever cuts the release to compare.
      - name: The release's own darwin sail
        if: inputs.release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sail-darwin-arm64
          path: ${{ runner.temp }}/sail

      - name: Install cosign
        if: inputs.release
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: The release's darwin sail, checked by its checksum and its signature
        if: inputs.release
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/sail/sail-darwin-arm64"
          published=$(< "$binary.sha256")
          actual=$(shasum -a 256 "$binary" | cut -d' ' -f1)
          echo "bundled sail-darwin-arm64 sha256: $actual"
          echo "the release's sail-darwin-arm64.sha256: $published"
          [[ $actual == "$published" ]] || { echo "the binary is not the one the release publishes" >&2; exit 1; }
          cosign verify-blob --bundle "$binary.cosign.bundle" \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$binary"
          chmod +x "$binary"
          ../../ci/check min-macos "$binary"
          version=$("$binary" -V | tail -1)
          echo "$version"
          if [[ $GITHUB_REF != refs/tags/* ]]; then
            echo "a release dispatched from $GITHUB_REF_NAME, not from a tag, ships no app: cut the release from its tag" >&2
            exit 1
          fi
          [[ $version == "sail ${GITHUB_REF_NAME#v}" ]] || { echo "the binary is $version, not the release ${GITHUB_REF_NAME}" >&2; exit 1; }
          echo "SAIL_BINARY=$binary" >> "$GITHUB_ENV"

      - name: For the bundle and this machine's own host
        if: ${{ !inputs.release }}
        run: |
          chmod +x "$RUNNER_TEMP/sail/sail"
          echo "SAIL_BINARY=$RUNNER_TEMP/sail/sail" >> "$GITHUB_ENV"

      - name: Build
        run: swift build --build-tests

      # Every suite the package lists, each in its own bounded run (ci/test-suites): a suite added
      # later runs without a list to edit, and one that runs no test fails the step.
      - name: Test
        timeout-minutes: 15
        env:
          SAIL_FRAMES_OUT: ${{ runner.temp }}/frames
        run: ci/test-suites "$RUNNER_TEMP/test-logs"

      - name: Release build, the shipped app and the drive build
        if: ${{ !cancelled() }}
        run: |
          swift build -c release
          ci/bundle Sail "$RUNNER_TEMP/app/Sail.app" "$SAIL_BINARY"
          ci/bundle SailDrive "$RUNNER_TEMP/drive/Sail.app" "$SAIL_BINARY"

      - name: Sign the drive build as the shipped app is signed
        if: ${{ !cancelled() }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: ci/sign "$RUNNER_TEMP/drive/Sail.app"

      - name: The bundled sail runs under the hardened runtime from inside the bundle
        if: ${{ !cancelled() }}
        run: |
          selftest=$("$RUNNER_TEMP/drive/Sail.app/Contents/Helpers/sail" _pty-selftest)
          echo "$selftest"
          grep -qx 'local-selftest: ok' <<< "$selftest"

      # The system accent graphite first, so a view that took the system's accent would show it.
      # Not in a release: the same commit's Clients run on main drives it, and the drive's first
      # script judges timings (a flood, a blink, the main thread's waits) on which the next builds,
      # so a slow runner must not cost a release its app. The bundled sail's own check above runs.
      - name: Drive the app against this Mac's own host and two control planes
        if: ${{ !cancelled() && !inputs.release }}
        env:
          SAIL_SIGNING: ${{ env.SIGNING }}
        # The Dock hides, so every runner leaves windows the screen less its menu bar: AppKit keeps a
        # window inside the screen's visible frame, and a runner whose Dock stood 2 pt taller cut the
        # design's 684 pt window to 682.
        run: |
          defaults write -g AppleAccentColor -int -1
          defaults write com.apple.dock autohide -bool true
          killall Dock
          ci/drive "$RUNNER_TEMP/drive/Sail.app" "$RUNNER_TEMP/drive-out"

      - name: Sign the shipped app with Developer ID
        if: env.SIGNING == 'on'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: ci/sign "$RUNNER_TEMP/app/Sail.app"

      - name: Sign the unsigned build ad hoc (no signing secrets)
        if: env.SIGNING == 'off'
        run: ci/sign "$RUNNER_TEMP/app/Sail.app"

      - name: Notarize and staple
        if: env.SIGNING == 'on'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/shipped"
          ci/notarize "$RUNNER_TEMP/app/Sail.app" "$RUNNER_TEMP/shipped/$SHIPPED.zip"

      # Checked on every build: the bundle's shape, the hardened runtime, no harness and no software
      # passkey in the shipped binary, no entitlements on the bundled sail, the bundled sail running
      # from inside it, and the app launching and staying up.
      - name: Check the bundle (every build)
        run: |
          app="$RUNNER_TEMP/app/Sail.app"
          test "$(plutil -extract CFBundleExecutable raw "$app/Contents/Info.plist")" = Sail
          test "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" = sh.standardapplied.sail
          test -x "$app/Contents/MacOS/Sail" && test -x "$app/Contents/Helpers/sail"
          for font in Regular Medium SemiBold Bold Italic BoldItalic; do test -f "$app/Contents/Resources/Fonts/JetBrainsMono-$font.ttf"; done
          test -f "$app/Contents/Resources/Fonts/OFL.txt" && test -f "$app/Contents/Resources/Acknowledgements.txt"
          test -f "$app/Contents/Resources/Fonts/Newsreader16pt-Medium.ttf" && test -f "$app/Contents/Resources/Fonts/Newsreader-OFL.txt"
          icon=$(plutil -extract CFBundleIconFile raw "$app/Contents/Info.plist")
          test -s "$app/Contents/Resources/$icon" || { echo "the icon the Info.plist names, $icon, is not in the bundle" >&2; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --verbose=2 "$app" 2>&1 | grep -E 'flags=.*runtime'
          codesign -d --verbose=2 "$app/Contents/Helpers/sail" 2>&1 | grep -E 'flags=.*runtime'
          if strings "$app/Contents/MacOS/Sail" | grep -q SailDrive; then echo "the drive harness is in the shipped app" >&2; exit 1; fi
          # The marker string, and the module's name, which every Swift type's context descriptor
          # carries as a string whatever the type's kind and even in a stripped binary (a symbol name
          # is mangled with word substitutions and is gone once stripped).
          if strings "$app/Contents/MacOS/Sail" | grep -Eq 'sail-test-passkey-not-for-shipping|SailTestPasskey'; then
            echo "the software passkey is in the shipped app" >&2
            exit 1
          fi
          inner=$(codesign -d --entitlements - --xml "$app/Contents/Helpers/sail" 2>/dev/null || true)
          if [[ -n $inner ]] && [[ $(plutil -convert json -o - - <<< "$inner") != "{}" ]]; then
            echo "the bundled sail claims entitlements" >&2
            exit 1
          fi
          selftest=$("$app/Contents/Helpers/sail" _pty-selftest)
          grep -qx 'local-selftest: ok' <<< "$selftest"
          "$app/Contents/MacOS/Sail" &
          launched=$!
          sleep 5
          kill -0 "$launched" || { wait "$launched"; echo "Sail did not stay up: it exited with $?" >&2; exit 1; }
          kill "$launched"

      # Checked only when signed: skipped, not passed, on an unsigned build. The entitlements are
      # printed as codesign shows them; the profile never is, only its expiry.
      - name: Check Developer ID, the profile, the entitlements, the stapled notarization and Gatekeeper (signed builds only)
        if: env.SIGNING == 'on'
        run: |
          app="$RUNNER_TEMP/app/Sail.app"
          claims="$RUNNER_TEMP/signed.entitlements"
          profile="$RUNNER_TEMP/embedded.plist"
          trap 'rm -f "$profile"' EXIT
          codesign -d --entitlements - --xml "$app" 2>/dev/null | plutil -convert xml1 -o "$claims" -
          echo "The entitlements as signed:"
          cat "$claims"
          security cms -D -i "$app/Contents/embedded.provisionprofile" -o "$profile" 2>/dev/null
          team=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile")
          signed=$(codesign -dv "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')
          [[ $signed == "$team" ]] || { echo "the profile's team is not the signature's" >&2; exit 1; }
          [[ $(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.application-identifier' "$profile") == "$team.sh.standardapplied.sail" ]] \
            || { echo "the profile is not for the App ID sh.standardapplied.sail" >&2; exit 1; }
          [[ $(/usr/libexec/PlistBuddy -c 'Print :com.apple.application-identifier' "$claims") == "$team.sh.standardapplied.sail" ]]
          [[ $(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.team-identifier' "$claims") == "$team" ]]
          [[ $(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.associated-domains:0' "$claims") == webcredentials:sail.standardapplied.com ]]
          allowed=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.associated-domains' "$profile" 2>/dev/null || true)
          if grep -qx '\*' <<< "$allowed"; then
            echo "The profile allows every associated domain (*)."
          elif grep -q 'webcredentials:sail.standardapplied.com' <<< "$allowed"; then
            echo "The profile allows webcredentials:sail.standardapplied.com."
          else
            echo "the profile does not allow webcredentials:sail.standardapplied.com" >&2
            exit 1
          fi
          expires=$(plutil -extract ExpirationDate raw "$profile")
          days=$(( ($(date -j -u -f '%Y-%m-%dT%H:%M:%SZ' "$expires" +%s) - $(date -u +%s)) / 86400 ))
          echo "The profile expires $expires, in $days days."
          (( days >= 30 )) || { echo "the profile has fewer than 30 days left: make a new one" >&2; exit 1; }
          codesign -d --verbose=2 "$app" 2>&1 | grep -q '^Authority=Developer ID Application'
          codesign -d --verbose=2 "$app/Contents/Helpers/sail" 2>&1 | grep -q '^Authority=Developer ID Application'
          ci/stapler validate "$app"
          spctl -a -vv -t exec "$app" 2>&1 | tee /dev/stderr | grep -q 'source=Notarized Developer ID'

      # Reported, failing nothing: whether the association file and Apple's CDN copy name the app.
      # The team id is matched, never printed.
      - name: The association file and Apple's CDN copy (reported only)
        continue-on-error: true
        run: |
          app="$RUNNER_TEMP/app/Sail.app"
          wanted='\.sh\.standardapplied\.sail"'
          if [[ -f $app/Contents/embedded.provisionprofile ]]; then
            team=$(security cms -D -i "$app/Contents/embedded.provisionprofile" 2>/dev/null | plutil -extract TeamIdentifier.0 raw -)
            wanted="\"$team\\.sh\\.standardapplied\\.sail\""
          fi
          mkdir -p "$RUNNER_TEMP/drive-out"
          for url in https://sail.standardapplied.com/.well-known/apple-app-site-association \
            https://app-site-association.cdn-apple.com/a/v1/sail.standardapplied.com; do
            if body=$(curl -fsS --max-time 20 "$url" 2>&1); then
              if grep -Eq "$wanted" <<< "$body"; then said="names the app"; else said="answers and does not name the app"; fi
            else
              said="does not answer: ${body//$'\n'/ }"
            fi
            echo "$url $said"
          done | tee "$RUNNER_TEMP/drive-out/aasa.txt"

      - name: Zip the unsigned build
        if: env.SIGNING == 'off'
        run: |
          mkdir -p "$RUNNER_TEMP/shipped"
          ditto -c -k --keepParent "$RUNNER_TEMP/app/Sail.app" "$RUNNER_TEMP/shipped/${SHIPPED/#Sail-/Sail-unsigned-}.zip"

      # The zip ditto made, uploaded as it is (not zipped again), so the download is that zip and
      # one unzip gives Sail.app with its signature, stapled ticket, symlinks and modes; the
      # artifact is named for the file.
      - name: Leave the app, one zip
        id: shipped
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/shipped/Sail-*.zip
          archive: false
          retention-days: 14
          if-no-files-found: error

      # What a person downloads, asked of GitHub's artifact API by the zip's id, with no second
      # listing to disagree with it: run 44464696183's download was told "No artifacts found for ID"
      # 0.4 s after the upload, and #491's, after a wait that read this API, was told by
      # download-artifact's own listing that the id was not there. The bytes must be the zip the
      # job notarized: their SHA-256 is both the upload's digest and the shipped file's.
      - name: The download, as the artifact service hands it out
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ steps.shipped.outputs.artifact-id }}
          DIGEST: ${{ steps.shipped.outputs.artifact-digest }}
        run: |
          shopt -s nullglob
          shipped=("$RUNNER_TEMP"/shipped/Sail-*.zip)
          (( ${#shipped[@]} == 1 )) || { echo "::error::the job shipped ${#shipped[@]} zips, not one"; exit 1; }
          mkdir -p "$RUNNER_TEMP/download"
          zip="$RUNNER_TEMP/download/$(basename "${shipped[0]}")"
          for attempt in 1 2 3 4 5 6; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT/zip" > "$zip" 2> "$RUNNER_TEMP/download.err"; then
              (( attempt == 1 )) || echo "GitHub's artifact service served artifact $ARTIFACT on try $attempt, after $(( (attempt - 1) * 5 )) s."
              break
            fi
            if (( attempt == 6 )); then
              echo "::error::GitHub's artifact service accepted artifact $ARTIFACT at its upload but did not serve it within 30 s ($(tr '\n' ' ' < "$RUNNER_TEMP/download.err")), so what a person downloads could not be checked."
              exit 1
            fi
            sleep 5
          done
          got=$(shasum -a 256 "$zip" | cut -d ' ' -f 1)
          made=$(shasum -a 256 "${shipped[0]}" | cut -d ' ' -f 1)
          if ! [[ $got == "${DIGEST#sha256:}" && $got == "$made" ]]; then
            echo "::error::the download's SHA-256 is $got, the upload's digest ${DIGEST#sha256:} and the shipped zip's $made: what a person downloads is not the zip this job made."
            exit 1
          fi
          echo "The download is the zip this job made: SHA-256 $got."

      # What a person gets: the downloaded file is one zip; unpacked as Finder's Archive Utility
      # does (ditto), with the quarantine a browser download carries, it is Sail.app alone, its
      # executables executable, its symlinks those of the built app, its signature whole and, when
      # signed, its stapled ticket valid and Gatekeeper's answer "Notarized Developer ID".
      - name: Check the download as Finder unpacks it (every build)
        run: |
          shopt -s nullglob
          downloaded=("$RUNNER_TEMP"/download/*)
          (( ${#downloaded[@]} == 1 )) || { echo "the download is ${#downloaded[@]} files, not one zip" >&2; exit 1; }
          [[ $(file -b "${downloaded[0]}") == Zip* ]] || { echo "the download is not a zip: $(file -b "${downloaded[0]}")" >&2; exit 1; }
          unpacked="$RUNNER_TEMP/unpacked"
          rm -rf "$unpacked"
          ditto -x -k "${downloaded[0]}" "$unpacked"
          [[ $(ls -A "$unpacked") == Sail.app ]] || { echo "one unzip gives $(ls -A "$unpacked" | tr '\n' ' '), not Sail.app" >&2; exit 1; }
          app="$unpacked/Sail.app"
          xattr -r -w com.apple.quarantine "0083;$(printf %x "$(date +%s)");Safari;" "$app"
          test -x "$app/Contents/MacOS/Sail" && test -x "$app/Contents/Helpers/sail"
          diff <(cd "$RUNNER_TEMP/app/Sail.app" && find . -type l | sort) <(cd "$app" && find . -type l | sort)
          codesign --verify --deep --strict --verbose=2 "$app"
          if [[ $SIGNING == on ]]; then
            ci/stapler validate "$app"
            spctl -a -vv -t exec "$app" 2>&1 | tee /dev/stderr | grep -q 'source=Notarized Developer ID'
          fi
          echo "One unzip of the download gives Sail.app, whole."

      - name: Leave the frames, the drive's images and reports, and the test suites' logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sailapp-frames-and-drive-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ${{ runner.temp }}/frames
            ${{ runner.temp }}/drive-out
            ${{ runner.temp }}/test-logs

      - name: Leave the drive's figures, a small table the trend reads back
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: drive-figures-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 90
          path: ${{ runner.temp }}/drive-out/figures.tsv

      - name: Leave the window as the screen showed it, in both looks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sailapp-screenshots-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: ${{ runner.temp }}/drive-out/window
