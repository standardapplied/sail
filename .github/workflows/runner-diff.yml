name: Runner differences (trial only)

on:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, blacksmith-4vcpu-ubuntu-2404]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Kernel, ZFS, Swift and the login shell's HOME
        run: |
          echo "kernel: $(uname -r)"
          echo "image: ${ImageOS:-none} ${ImageVersion:-none}"
          modinfo -F version zfs 2>&1 | sed 's/^/zfs module: /'
          ls /sys/module/loop/parameters/ 2>&1 | tr '\n' ' '; echo
          cat /sys/module/loop/parameters/max_part 2>&1 | sed 's/^/loop max_part: /'
          swift --version 2>&1 | head -1
          mkdir -p "$RUNNER_TEMP/home"
          echo "HOME under bash -lc with HOME=$RUNNER_TEMP/home: $(HOME="$RUNNER_TEMP/home" bash -lc 'echo "$HOME"')"
          grep -n 'HOME' /etc/profile /etc/profile.d/* /etc/bash.bashrc /etc/environment 2> /dev/null || echo "no HOME in /etc/profile, /etc/profile.d, /etc/bash.bashrc, /etc/environment"
          ls -la /etc/profile.d

  macos:
    name: macOS (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, blacksmith-6vcpu-macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: The account's zsh and its bracketed paste
        run: |
          sw_vers -productVersion
          echo "image: ${ImageOS:-none} ${ImageVersion:-none}"
          echo "login shell: $(dscl . -read "/Users/$USER" UserShell)"
          zsh --version
          ls -la ~ | grep -i zsh || echo "no zsh file in the home"
          for f in ~/.zshenv ~/.zprofile ~/.zshrc ~/.zlogin; do [[ -f $f ]] && { echo "== $f"; cat "$f"; }; done
          grep -n -i 'bracketed\|zle' /etc/zshrc /etc/zprofile /etc/zshenv 2> /dev/null || echo "no bracketed paste or zle in /etc/zsh*"
          script -q /dev/null zsh -lic 'print -r -- "zle_bracketed_paste=${zle_bracketed_paste-unset}"; exit' < /dev/null
