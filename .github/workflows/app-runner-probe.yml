name: App runner probe

on:
  push:
    branches:
      - agent/sail-app-a-terminal-view-draws-and-types-natively

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: sudo xcode-select --switch /Applications/Xcode_26.3.app
      - name: Machine
        run: |
          sw_vers
          uname -a
          sysctl -n hw.model machdep.cpu.brand_string hw.ncpu hw.memsize
          system_profiler SPHardwareDataType SPDisplaysDataType
          xcodebuild -version
          swift --version
      - name: Metal, AppKit and a display link
        timeout-minutes: 3
        continue-on-error: true
        run: |
          swiftc -O -swift-version 5 clients/SailApp/ci/metal-probe.swift -o "$RUNNER_TEMP/metal-probe"
          "$RUNNER_TEMP/metal-probe"
      - name: Cold swift build of SailKit
        working-directory: clients/SailKit
        run: |
          start=$(date +%s)
          swift build
          echo "cold swift build: $(( $(date +%s) - start )) s"
          start=$(date +%s)
          swift build --build-tests
          echo "then --build-tests: $(( $(date +%s) - start )) s"
