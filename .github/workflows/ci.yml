name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request replaces the run of the push before it; a run on main or by hand
# is never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# bash by name runs with pipefail, so a maven that fails still fails its step through the tee
# that keeps its log for the test-evidence action.
defaults:
  run:
    shell: bash

jobs:
  # The unit verdict, one module per job so the slowest module bounds it, not their sum. `ci/check
  # unit` runs the module's wildcard-import check, its tests and spotless, with its coverage gates
  # on Linux. macOS runs the same tests, since a release ships a macOS binary and only its own
  # tests see Apple's libraries. No other job runs a unit test.
  unit:
    name: Unit tests (${{ matrix.module }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        module: [sail-core, sail-harness, sail-infra]
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: graalvm/setup-graalvm@bef4b0e916c7dd079bf60fb95d49139f67e32c5f # v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/maven-cache
        with:
          kind: unit-${{ matrix.module }}

      - name: Unit tests and quality gates
        run: >
          ci/check unit ${{ matrix.module }} ${{ matrix.os != 'ubuntu-24.04' && '--no-coverage' || '' }}
          2>&1 | tee "$RUNNER_TEMP/maven.log"

      - name: Upload coverage reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && matrix.os == 'ubuntu-24.04'
        with:
          name: jacoco-reports-${{ matrix.module }}
          path: |
            ${{ matrix.module }}/target/site/jacoco
            ${{ matrix.module }}/target/site/jacoco.xml

      - name: Leave the test evidence
        if: always()
        uses: ./.github/actions/test-evidence
        with:
          job-status: ${{ job.status }}
          label: ${{ matrix.module }}-${{ matrix.os }}

  # A job of its own, so an NVD refresh that retries for minutes never holds the unit verdict.
  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: graalvm/setup-graalvm@bef4b0e916c7dd079bf60fb95d49139f67e32c5f # v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/maven-cache
        with:
          kind: scan

      # The NVD database is project-independent, so the cache key is keyed only on the OS,
      # never on pom.xml — a version bump must not cold-start the cache. github.run_id makes the
      # primary key unique so every run saves the refreshed database; restore-keys then pulls the
      # most recent prior database (including across branches via the default-branch cache).
      - name: Cache OWASP Dependency-Check NVD database
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/dependency-check-data
          key: dependency-check-nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            dependency-check-nvd-${{ runner.os }}-

      # Refresh the cached NVD database best-effort. NVD's API is frequently flaky (429/503/524);
      # when it is unreachable this step fails but never fails the build — the scan below runs
      # offline against whatever database the cache restored.
      - name: Refresh NVD database (best effort)
        continue-on-error: true
        run: >
          mvn -N -B org.owasp:dependency-check-maven:12.1.8:update-only
          -DnvdApiKey=${{ secrets.NVD_API_KEY }}
          -DdataDirectory=${{ runner.temp }}/dependency-check-data
          -DnvdValidForHours=168
          -DnvdApiDelay=4000
          -DnvdMaxRetryCount=30

      # autoUpdate=false: the scan never contacts NVD, so an NVD outage cannot fail the build. It
      # analyzes against the cached database and still fails on a real CVE at or above CVSS 7.
      - name: Scan dependencies
        run: >
          mvn -B install org.owasp:dependency-check-maven:12.1.8:aggregate
          -DskipTests
          -Djacoco.skip=true
          -Dspotless.check.skip=true
          -Dformat=HTML
          -DfailBuildOnCVSS=7
          -DskipTestScope=true
          -DautoUpdate=false
          -DdataDirectory=${{ runner.temp }}/dependency-check-data

      - name: Upload dependency check reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-check-reports
          path: '**/target/dependency-check-report.html'

  # The one native build of this commit. Every suite that upgrades a fleet's release to this build
  # takes its two inputs from here: the quick-build (-Ob) candidate and the release
  # .github/released-tag pins. A release builds its own optimized binaries.
  native:
    name: Native binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: graalvm/setup-graalvm@bef4b0e916c7dd079bf60fb95d49139f67e32c5f # v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/maven-cache
        with:
          kind: native

      - name: Build and fetch the native binaries
        id: binaries
        uses: ./.github/actions/native-binaries
        with:
          optimization: '-Ob'

      # One flat folder, so the artifact holds `sail` and `sail-linux-amd64` at its root.
      - name: Gather the native binaries
        run: |
          mkdir -p "$RUNNER_TEMP/native"
          cp "${{ steps.binaries.outputs.candidate }}" "${{ steps.binaries.outputs.released }}" "$RUNNER_TEMP/native/"

      - name: Upload the native binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-binaries
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/native

  # The native app's terminal core against this commit's real terminal hosts: this machine's own
  # (`sail _pty-host --local`) and a runner's ticketed TCP door on a box with Incus and a project.
  # The SailKit tests that need a host run here with the hosts named in their environment, then the
  # probe runs its scripts and leaves its reports. No token reaches an argv, a log or a report.
  terminal-e2e:
    name: Terminal end to end
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: clients/SailKit
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Take this commit's native binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-binaries
          path: ${{ runner.temp }}/native

      - name: Keep libghostty-vt built from its pins
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/sailkit/libghostty-vt
          key: libghostty-vt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('clients/SailKit/scripts/libghostty-vt') }}

      - name: Keep SwiftPM's downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('clients/SailKit/Package.swift') }}

      - name: Build the tests and the probe
        run: |
          scripts/libghostty-vt "$HOME/.cache/sailkit/libghostty-vt"
          export PKG_CONFIG_PATH="$HOME/.cache/sailkit/libghostty-vt/lib/pkgconfig"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          swift build --build-tests
          swift build -c release --product sail-term-probe
          echo "PROBE=$(swift build -c release --show-bin-path)/sail-term-probe" >> "$GITHUB_ENV"
          chmod +x "$RUNNER_TEMP/native/sail"
          mkdir -p "$RUNNER_TEMP/reports"

      - name: The screen's own overhead
        run: '"$PROBE" --bench --report "$RUNNER_TEMP/reports/bench.json"'

      - name: This machine's own host
        env:
          SAIL_BINARY: ${{ runner.temp }}/native/sail
        run: |
          swift test --filter RealLocalHostTests
          for script in local measure; do
            "$PROBE" --local --host-binary "$SAIL_BINARY" --folder /tmp --script "Tests/Probe/$script.json" \
              --report "$RUNNER_TEMP/reports/local-$script.json"
          done

      - name: Set up incus
        uses: ./.github/actions/incus

      - name: A box with a project, its API and terminal door on loopback
        run: |
          sudo install -m 755 "$RUNNER_TEMP/native/sail" /usr/local/bin/sail
          sudo -H sail init --as-main --handle ada --name 'Ada E2E' --email ada@e2e.example
          echo '{"name":"demo","resources":{"cpu":2,"memory":"2GB","disk":"10GB"}}' | sudo -H sail project create demo --definition -
          sudo -H sail project apply demo
          sudo -H sail host config set api-listen 127.0.0.1:7071
          sudo -H sail host config set terminal-listen 127.0.0.1:7072
          sudo systemctl restart sail-api sail-pty-host
          for attempt in $(seq 1 60); do
            curl -sf http://127.0.0.1:7071/v1/health > /dev/null && break
            sleep 1
          done
          sudo -H sail fde add eng --role member --name 'Eng E2E' --email eng@e2e.example
          sudo -H sail host status

      - name: The runner's door, through tickets
        run: |
          token=$(sudo -H sail server token create e2e-ada member --fde ada 2> /dev/null | sed -n 2p | tr -d ' ')
          other=$(sudo -H sail server token create e2e-eng member --fde eng 2> /dev/null | sed -n 2p | tr -d ' ')
          echo "::add-mask::$token"
          echo "::add-mask::$other"
          if [[ -z $token || -z $other ]]; then
            echo "::error::the box minted no token"
            exit 1
          fi
          SAIL_API=http://127.0.0.1:7071 SAIL_TOKEN=$token SAIL_OTHER_TOKEN=$other SAIL_PROJECT=demo \
            swift test --filter RealRunnerTests
          SAIL_E2E_TOKEN=$token "$PROBE" --api http://127.0.0.1:7071 --token-env SAIL_E2E_TOKEN --project demo \
            --script Tests/Probe/runner.json --report "$RUNNER_TEMP/reports/runner.json" \
            > "$RUNNER_TEMP/probe.out" 2> "$RUNNER_TEMP/probe.err" &
          probe=$!
          samples=0
          while kill -0 "$probe" 2> /dev/null; do
            ps -eo args >> "$RUNNER_TEMP/argv.txt"
            samples=$((samples + 1))
          done
          status=0
          wait "$probe" || status=$?
          cat "$RUNNER_TEMP/probe.err"
          echo "every process's argv was sampled $samples times during the run"
          if grep -qF -f <(printf '%s\n' "$token") "$RUNNER_TEMP/argv.txt" "$RUNNER_TEMP/probe.out" "$RUNNER_TEMP/probe.err" "$RUNNER_TEMP/reports/runner.json"; then
            echo "::error::the token appeared in an argv, the probe's output or its report"
            exit 1
          fi
          rm "$RUNNER_TEMP/argv.txt"
          [[ $status == 0 ]]
          SAIL_E2E_TOKEN=$token "$PROBE" --api http://127.0.0.1:7071 --token-env SAIL_E2E_TOKEN --project demo \
            --script Tests/Probe/measure.json --report "$RUNNER_TEMP/reports/runner-measure.json"

      - name: Leave the probe's reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terminal-e2e-reports
          if-no-files-found: ignore
          path: ${{ runner.temp }}/reports

  # Each fleet test opens a fleet of its own, so the suite splits by test into three parts.
  native-fleet:
    name: Native fleet sync tests (part ${{ matrix.part }} of 3)
    needs: native
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: graalvm/setup-graalvm@bef4b0e916c7dd079bf60fb95d49139f67e32c5f # v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/maven-cache
        with:
          kind: native-fleet

      - name: Take this commit's native binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-binaries
          path: ${{ runner.temp }}/native

      # Sync end to end on the native binaries: Podman boxes, a real sshd and the gateway's forced
      # command. Only this suite runs here; requireNative turns a missing binary or an unreachable
      # Podman into a failure instead of a skip.
      - name: Native fleet sync tests
        run: |
          chmod +x "$RUNNER_TEMP/native/sail" "$RUNNER_TEMP/native/sail-linux-amd64"
          tests=$(ci/check methods NativeFleetIT ${{ matrix.part }} 3)
          mvn -B -Pintegration verify \
            -Dit.test="$tests" \
            -Dtest=NoUnitTests \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dfailsafe.failIfNoSpecifiedTests=false \
            -Djacoco.skip=true \
            -Dspotless.check.skip=true \
            -Dsail.it.requireIncus=false \
            -Dsail.it.requireSystemd=false \
            -Dsail.it.requireNative=true \
            -Dsail.it.nativeBinary="$RUNNER_TEMP/native/sail" \
            -Dsail.it.releasedBinary="$RUNNER_TEMP/native/sail-linux-amd64" \
            2>&1 | tee "$RUNNER_TEMP/maven.log"

      - name: Leave the test evidence
        if: always()
        uses: ./.github/actions/test-evidence
        with:
          job-status: ${{ job.status }}
          label: part-${{ matrix.part }}

  fleet-integration:
    name: Multi-node control-plane integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: graalvm/setup-graalvm@bef4b0e916c7dd079bf60fb95d49139f67e32c5f # v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/maven-cache
        with:
          kind: multi-node

      - name: Enable the runner's systemd user manager
        uses: ./.github/actions/systemd-user

      # The unit suite and its coverage gates are the unit jobs'; only failsafe runs here.
      - name: Run multi-node integration tests without incus
        run: >
          mvn -B -Pintegration verify
          -Dsail.it.requireIncus=false
          -Dtest=NoUnitTests
          -Dsurefire.failIfNoSpecifiedTests=false
          -Djacoco.skip=true
          -Dspotless.check.skip=true
          2>&1 | tee "$RUNNER_TEMP/maven.log"

      - name: Leave the test evidence
        if: always()
        uses: ./.github/actions/test-evidence
        with:
          job-status: ${{ job.status }}

  # The incus suites in shards balanced on ci/it-seconds. `ci/check shard` places every IT class,
  # one with no recorded time included, in exactly one shard. The two suites that take the native
  # binaries run in their own jobs, so no shard waits for the native build.
  incus-integration:
    name: Incus-backed integration tests (shard ${{ matrix.shard }} of 4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: graalvm/setup-graalvm@bef4b0e916c7dd079bf60fb95d49139f67e32c5f # v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/maven-cache
        with:
          kind: incus

      - name: Enable the runner's systemd user manager
        uses: ./.github/actions/systemd-user

      - name: Set up incus
        id: incus
        uses: ./.github/actions/incus

      - name: Run incus integration tests
        run: >
          ci/check its ${{ matrix.shard }} 4 NativeFleetIT UpgradeE2EIT -- -Dsail.it.requireNative=true
          2>&1 | tee "$RUNNER_TEMP/maven.log"

      - name: Keep the prepared image for the next run
        if: success() && steps.incus.outputs.prepared-hit != 'true'
        run: ci/check prepared-image export "$RUNNER_TEMP/prepared-image"

      - name: Leave the test evidence
        if: always()
        uses: ./.github/actions/test-evidence
        with:
          job-status: ${{ job.status }}
          label: shard-${{ matrix.shard }}

  # The upgrade end to end on incus: the release .github/released-tag pins, upgraded to this
  # commit's native binary.
  native-upgrade:
    name: Native upgrade tests
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: graalvm/setup-graalvm@bef4b0e916c7dd079bf60fb95d49139f67e32c5f # v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/maven-cache
        with:
          kind: incus

      - name: Enable the runner's systemd user manager
        uses: ./.github/actions/systemd-user

      - name: Set up incus
        id: incus
        uses: ./.github/actions/incus

      - name: Take this commit's native binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: native-binaries
          path: ${{ runner.temp }}/native

      - name: Run the native upgrade tests
        run: |
          chmod +x "$RUNNER_TEMP/native/sail" "$RUNNER_TEMP/native/sail-linux-amd64"
          mvn -B -Pintegration verify \
            -Dit.test=UpgradeE2EIT \
            -Dtest=NoUnitTests \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dfailsafe.failIfNoSpecifiedTests=false \
            -Djacoco.skip=true \
            -Dspotless.check.skip=true \
            -Dsail.it.requireNative=true \
            -Dsail.it.nativeBinary="$RUNNER_TEMP/native/sail" \
            -Dsail.it.releasedBinary="$RUNNER_TEMP/native/sail-linux-amd64" \
            2>&1 | tee "$RUNNER_TEMP/maven.log"

      - name: Leave the test evidence
        if: always()
        uses: ./.github/actions/test-evidence
        with:
          job-status: ${{ job.status }}

  # The one check a branch rule requires. A job that needs another reads as skipped when that one
  # fails, and a skipped check reads as passing, so this fails unless every job succeeded.
  ci-passed:
    name: CI passed
    if: always()
    needs:
      [unit, dependency-scan, native, native-fleet, native-upgrade, fleet-integration, incus-integration, terminal-e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::A job ended $result, so this commit is not proven."
              exit 1
            fi
          done
