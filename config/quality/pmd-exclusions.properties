# PMD exclusions: fully.qualified.Class=Rule1,Rule2 (a nested class is Outer.Nested), one line per
# class, from the first column, with no space. Policy: AGENTS.md, "Quality gate". No class is ever
# added and no rule is added to an entry: a spec that works in a listed class splits it and deletes
# the entry. ci/exclusions fails a change whose class=rule pairs are not all in its merge base's,
# that names a class twice, or that holds a line other than a # comment, a blank or one entry;
# ExclusionsShrinkTest fails on an entry naming a class that no longer breaks every rule it lists.

